<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREARE × J&K</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #f8f6f2;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Noto Sans KR",
                   Arial, sans-serif;
      color: #171717;
    }

    .wrap {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    .benefit-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .store-info {
      max-width: 520px;
      margin: 0 auto;
      padding: 38px 24px 45px;
      text-align: center;
    }

    .store-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .address {
      font-size: 13px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 23px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .button {
      flex: 1;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #222;
    }

    .phone {
      background: #171717;
      color: white;
    }

    .map {
      background: transparent;
      color: #171717;
    }

    .footer {
      margin-top: 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <!-- 기존 디자인 이미지 그대로 -->
    <img
      src="jk-benefits.png"
      alt="CREARE × J&K Private Benefits"
      class="benefit-image"
    >

    <!-- 이미지 아래 매장 정보 -->
    <div class="store-info">

      <div class="store-name">
        CREARE TAILOR SHOP
      </div>

      <div class="address">
        경기 남양주시 다산중앙로82번안길 162<br>
        1층 101호
      </div>

      <div class="buttons">

        <a
          href="tel:01046348175"
          class="button phone">
          전화 문의
        </a>

        <a
          href="https://naver.me/FJO0sC7d"
          target="_blank"
          rel="noopener noreferrer"
          class="button map">
          네이버지도
        </a>

      </div>

      <div class="footer">
        FOR THOSE WHO APPRECIATE WELL-MADE TAILORING.
      </div>

    </div>

  </div>

</body>
</html>
